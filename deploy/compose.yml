name: diagram-studio
services:
  db:
    image: mysql:8.4.13
    command: [--skip-log-bin]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: diagram_studio
      MYSQL_USER: diagram_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate deploy/.env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate deploy/.env first}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --protocol=TCP, --silent]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    environment:
      WORKER_KEY: ${WORKER_KEY:?Generate deploy/.env first}
    shm_size: 256mb
    mem_limit: 1536m
    pids_limit: 256
    init: true
    networks: [backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      DB_URL: jdbc:mysql://db:3306/diagram_studio?connectionTimeZone=UTC&characterEncoding=UTF-8
      DB_USER: diagram_app
      DB_PASSWORD: ${DB_PASSWORD:?Generate deploy/.env first}
      WORKER_URL: http://worker:3001
      WORKER_KEY: ${WORKER_KEY:?Generate deploy/.env first}
      EXPORT_DIRECTORY: /data/exports
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
    volumes: [export-data:/data]
    mem_limit: 768m
    depends_on:
      db: { condition: service_healthy }
      worker: { condition: service_healthy }
    networks: [backend]
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:8080"]
    depends_on: [api]
    networks: [backend]
volumes:
  mysql-data:
  export-data:
networks:
  backend:
